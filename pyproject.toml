# this_file: pyproject.toml
[project]
name = "d361"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
    "httpx>=0.25.0",        # Unified HTTP client (replaces aiohttp)
    "pydantic>=2.0,<3.0",   # Pydantic v2 for data validation
    "pydantic-settings>=2.0,<3.0",  # BaseSettings (moved from pydantic v1)
    "email-validator>=2.0.0",  # Required for pydantic EmailStr
    "PyYAML>=6.0",  # YAML parsing for mkdocs config generation
    "Jinja2>=3.0",  # Template rendering for mkdocs config generator
    "aiohttp>=3.9.0",  # Async HTTP client (legacy offline parser)
    "aiosqlite>=0.19.0",  # Async SQLite for performance tests
    "rich>=13.0.0",         # Rich terminal output
    "fire>=0.5.0",          # CLI framework
    "loguru>=0.7.0",        # Structured logging
    "tenacity>=8.2.0",      # Retry mechanisms
    "diskcache>=5.6.0",     # Persistent caching
    "playwright>=1.40.0",   # Web scraping (optional)
    "beautifulsoup4>=4.12.0", # HTML parsing
    "markdownify>=0.11.0",  # HTML to Markdown conversion
    "lxml>=5.3.1",         # XML/HTML parsing
    "aiofiles>=23.0.0",    # Async file operations
    "watchdog>=3.0.0",     # Config hot-reload file watching
    "d361api>=2.2.8",      # Auto-generated Document360 API client (nested layout)
]


[project.optional-dependencies]

# Core optional dependencies
scraping = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
]

api = [
    "httpx-auth>=0.16.0",  # Authentication helpers
]

# Development dependencies
dev = [
    "pre-commit>=3.6.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyupgrade>=3.19.0",
    "types-aiofiles",
    "types-beautifulsoup4",
    "bandit>=1.7.0",       # Security scanning
]

# Testing dependencies
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",       # For testing HTTP clients
    "pytest-httpx>=0.21.0", # Mock HTTP responses
    "pytest-benchmark>=4.0.0", # Performance benchmarks
    "psutil>=5.9.0",       # Memory/CPU sampling in performance tests
]

# Monitoring dependencies  
monitoring = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "prometheus-client>=0.19.0",
]


all = [
]

[project.scripts]
d361 = "d361.cli.main:main_cli"
d361-offline = "d361.offline.__main__:main"  # Keep legacy entry point

[project.entry-points."d361.converters"]
# Plugin entry points for converters will be registered here
# Example: confluence = "d361_plugins.confluence:ConfluenceConverter"

[project.entry-points."d361.providers"] 
# Plugin entry points for data providers
# Example: custom = "d361_plugins.custom:CustomProvider"



[[project.authors]]
name = "Adam Twardoch"
email = "adam+github@twardoch.com"

[project.urls]
Documentation = "https://github.com/twardoch/d361#readme"
Issues = "https://github.com/twardoch/d361/issues"
Source = "https://github.com/twardoch/d361"


[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling>=1.21.0", 
    "hatch-vcs>=0.3.0"
]


[tool.coverage.paths]
d361 = ["src/d361", "*/d361/src/d361"]
tests = ["tests", "*/d361/tests"]



[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
source_pkgs = ["d361", "tests"]
branch = true
parallel = true
omit = [
    "src/d361/__about__.py",
]



[tool.hatch.build.hooks.vcs]
version-file = "src/d361/__version__.py"


[tool.hatch.build.targets.wheel]
packages = ["src/d361"]



[tool.hatch.envs.default]
dependencies = [
  "d361", # Install the project itself by its name
  "mypy>=1.0.0",
  # "types-tenacity", # Tenacity should be typed directly
  # "types-python-fire", # Fire should be typed directly
  "types-aiofiles", # Stubs for aiofiles
  "pytest>=7.0.0", # For MyPy to find pytest stubs
  # Ruff is also good to have for other default scripts like lint/fix
  "ruff>=0.1.0"
]
# This ensures MyPy and the project deps (like pydantic) are in the same env.

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12"]


[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=src/d361 --cov=tests {args:tests}"
type-check = "mypy src/d361 tests"
lint = ["ruff check src/d361 tests", "ruff format --respect-gitignore src/d361 tests"]
fix = ["ruff check  --fix --unsafe-fixes src/d361 tests", "ruff format --respect-gitignore src/d361 tests"]



[tool.hatch.envs.lint]
detached = true
dependencies = [
]


[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:src/d361 tests}"
style = ["ruff check {args:.}", "ruff format --respect-gitignore {args:.}"]
fmt = ["ruff format --respect-gitignore {args:.}", "ruff check --fix {args:.}"]
all = ["style", "typing"]


[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "pytest-asyncio>=0.21.0",
  "pytest-httpx>=0.21.0",
  "anyio[asyncio]>=4.0.0",
]

[tool.hatch.envs.test]
dependencies = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-mock>=3.10.0",
  "pytest-xdist>=3.0.0", # For -n auto parallel execution
  "pytest-asyncio>=0.21.0",
  "pytest-httpx>=0.21.0",
  "anyio[asyncio]>=4.0.0",
]

[tool.hatch.envs.test.scripts]
test = "python -m pytest -n auto -p no:briefcase {args:tests}"
test-cov = "python -m pytest -n auto -p no:briefcase --cov-report=term-missing --cov-config=pyproject.toml --cov=src/d361 --cov=tests {args:tests}"
bench = "python -m pytest -v -p no:briefcase tests/test_benchmark.py --benchmark-only"
bench-save = "python -m pytest -v -p no:briefcase tests/test_benchmark.py --benchmark-only --benchmark-json=benchmark/results.json"

[tool.hatch.version]
source = "vcs"
path = 'src/d361/__version__.py'
pattern = "__version__\\s*=\\s*version\\s*=\\s*['\"](?P<version>[^'\"]+)['\"]"


[tool.hatch.version.raw-options]
version_scheme = "post-release"


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = [
  "pydantic.mypy"
]

[[tool.mypy.overrides]]
module = [
    "markdownify",
    "fire",
    "playwright.async_api", # Adding this too as it was missing earlier
    "tenacity" # If it still complains after removing types-tenacity
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "A",
    "ARG",
    "B",
    "C",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "I",
    "ICN",
    "ISC",
    "N",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "Q",
    "RUF",
    "S",
    "T",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "ARG001", "E501", "I001", "RUF001", "PLR2004", "EXE003", "ISC001",
    # Opinionated rules the codebase intentionally does not follow. This is a
    # CLI + web-scraper tool: booleans as flags, `print` for CLI output, naive
    # datetimes, relative imports, and lazy/optional imports are all deliberate.
    "FBT001", "FBT002", "FBT003",           # boolean-typed arguments (CLI flags)
    "PLC0415",                              # imports not at top-level (lazy/optional)
    "DTZ001", "DTZ005", "DTZ006",           # naive datetimes
    "EM101", "EM102",                       # exception message string literals
    "ARG002",                               # unused method args (interface impls)
    "TID252",                               # relative imports (intra-package)
    "B904", "B007", "B023",                 # raise-from / loop-var / closure nits
    "T201",                                 # print() in CLI output
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # complexity limits
    "PLW0603",                              # global statement
    "S105", "S108", "S110", "S311", "S324", "S608",      # bandit false-positives
    "E722", "E402", "A002", "N805",         # bare except / import order / shadowing
    "RUF005", "RUF012", "RUF013", "RUF015", "RUF022", "RUF034", "RUF059",  # ruff style preferences
    "A001", "ARG004", "ARG005", "B017", "B905", "C401", "DTZ007", "N802",
    "N818", "PLC0206", "PLR0206", "PLR1714", "PLW0108", "PLW1510", "PLW2901",
    "S112", "S301", "S506", "S603",         # more bandit/style false-positives
]



[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
# These modules import optional dependencies (PIL, etc.) inside guards to detect
# feature availability; the imports are intentional, not dead.
"src/d361/mkdocs/processors/asset_manager.py" = ["F401"]
"src/d361/mkdocs/processors/content_enhancer.py" = ["F401"]
"src/d361/mkdocs/processors/cross_reference_resolver.py" = ["F401"]
"src/d361/config/environment.py" = ["F401"]
"src/d361/config/secrets_manager.py" = ["F401"]





[tool.pytest.ini_options]
addopts = "-v --durations=10 -p no:briefcase"
asyncio_mode = "auto"
console_output_style = "progress"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
log_cli = true
log_cli_level = "INFO"
markers = [
  "benchmark: marks tests as benchmarks (select with '-m benchmark')",
  "unit: mark a test as a unit test",
  "integration: mark a test as an integration test",
  "permutation: tests for permutation functionality",
  "parameter: tests for parameter parsing",
  "prompt: tests for prompt parsing",
]
norecursedirs = [
  ".*",
  "build",
  "dist",
  "venv",
  "__pycache__",
  "*.egg-info",
  "_private",
]

python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]


[tool.pytest-benchmark]
min_rounds = 100
min_time = 0.1
histogram = true
storage = "file"
save-data = true
compare = [
    "min",    # Minimum time
    "max",    # Maximum time
    "mean",   # Mean time
    "stddev", # Standard deviation
    "median", # Median time
    "iqr",    # Inter-quartile range
    "ops",    # Operations per second
    "rounds", # Number of rounds
] 
